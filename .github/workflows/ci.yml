name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tesla_pool
          POSTGRES_USER: tesla
          POSTGRES_PASSWORD: tesla_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tesla -d tesla_pool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tesla:tesla_dev_password@localhost:5432/tesla_pool
      JWT_SECRET: ci-only-secret
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run apply-trigger
      - run: npx prisma db seed
      - run: npm test

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:4000
